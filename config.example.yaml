# AI Gateway Configuration
# Production configuration schema for Layer 1: Core Proxy & Multi-Tenant Authentication

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout_seconds: 15
  write_timeout_seconds: 60
  idle_timeout_seconds: 120
  max_body_bytes: 16777216 # 16 MB

upstreams:
  # Public SaaS Provider: OpenAI
  - id: "openai-primary"
    provider: "openai"
    endpoint_url: "https://api.openai.com"
    api_key: "${OPENAI_API_KEY:-sk-mock-openai-key}"
    timeout_seconds: 30

  # Public SaaS Provider: Anthropic Fallback
  - id: "anthropic-backup"
    provider: "anthropic"
    endpoint_url: "https://api.anthropic.com"
    api_key: "${ANTHROPIC_API_KEY:-sk-mock-anthropic-key}"
    timeout_seconds: 30

  # Internal GPU Inference Cluster: vLLM Emergency
  - id: "vllm-local"
    provider: "vllm"
    endpoint_url: "http://127.0.0.1:8000"
    api_key: ""
    timeout_seconds: 60

routes:
  # Flagship Frontier Model with Priority Tiers and Fallback Cascades:
  # Tier 0: Primary (OpenAI) -> Tier 1: Fallback (Anthropic) -> Tier 2: Emergency (vLLM)
  - alias: "gpt-4o"
    description: "Production reasoning with multi-provider fallback cascade"
    tiers:
      - priority: 0
        strategy: "weighted"
        targets:
          - upstream_id: "openai-primary"
            model: "gpt-4o"
            weight: 100
      - priority: 1
        strategy: "priority"
        targets:
          - upstream_id: "anthropic-backup"
            model: "claude-3-5-sonnet-20241022"
            weight: 100
      - priority: 2
        strategy: "emergency"
        targets:
          - upstream_id: "vllm-local"
            model: "meta-llama/Llama-3.3-70B-Instruct"
            weight: 100

  # Fast, Cost-Efficient Model (demonstrating backward compatibility with primary_upstream)
  - alias: "prod-fast"
    primary_upstream: "openai-primary"
    model_name: "gpt-4o-mini"

  # Self-Hosted Open-Weights Model
  - alias: "internal-llama"
    primary_upstream: "vllm-local"
    model_name: "meta-llama/Llama-3.3-70B-Instruct"

# Deterministic Data Loss Prevention (DLP) Policies
policies:
  # PCI-DSS Credit Card Guard: Blocks any raw credit card numbers
  - id: "pci-credit-card-guard"
    name: "PCI DSS Credit Card Exfiltration Guard"
    description: "Detects Visa, MasterCard, Amex PAN numbers with Luhn checksum verification"
    action: "BLOCK"
    patterns:
      - "credit_card"

  # Secret & Key Leakage Guard: Blocks AWS keys, private keys, and high-entropy strings
  - id: "secrets-leakage-guard"
    name: "Cryptographic Secrets & API Key Guard"
    description: "Detects AWS Secret Access Keys, PEM Private Key headers, and high-entropy secrets"
    action: "BLOCK"
    patterns:
      - "aws_key"
      - "private_key"
      - "high_entropy"

  # PII Masking: Redacts US Social Security Numbers in flight
  - id: "pii-ssn-masking"
    name: "PII SSN Redaction Policy"
    description: "Masks US Social Security Numbers with [REDACTED:pii-ssn-masking]"
    action: "MASK"
    patterns:
      - "ssn"

tenants:
  # Production Analytics Tenant
  - id: "tenant-analytics"
    name: "Analytics & BI Engineering"
    tier: "production"
    api_keys:
      - "sk-gw-live-analytics-key-4a8f9c"
      - "sk-gw-backup-analytics-key-2b7e1d"
    allowed_routes:
      - "gpt-4o"
      - "prod-fast"
      - "internal-llama"
    rate_limits:
      requests_per_minute: 600
      tokens_per_minute: 1000000
      max_concurrent: 50
    policy_bindings:
      - "pci-credit-card-guard"
      - "secrets-leakage-guard"
      - "pii-ssn-masking"
    metadata:
      cost_center: "CC-4011"
      department: "Data Platform"

  # Customer Support Automation Tenant
  - id: "tenant-support"
    name: "Support Automation Bot"
    tier: "production"
    api_keys:
      - "sk-gw-live-support-key-9f82d1"
    allowed_routes:
      - "prod-fast"
    rate_limits:
      requests_per_minute: 300
      tokens_per_minute: 300000
      max_concurrent: 20
    policy_bindings:
      - "pci-credit-card-guard"
      - "pii-ssn-masking"
    metadata:
      cost_center: "CC-5020"
      department: "Customer Operations"

  # Internal Developer Sandbox Tenant
  - id: "tenant-sandbox"
    name: "Internal Engineering Sandbox"
    tier: "sandbox"
    api_keys:
      - "sk-gw-sandbox-dev-key-77aa33"
    allowed_routes:
      - "*"
    rate_limits:
      requests_per_minute: 60
      tokens_per_minute: 100000
      max_concurrent: 5
    policy_bindings:
      - "secrets-leakage-guard"
    metadata:
      environment: "development"

